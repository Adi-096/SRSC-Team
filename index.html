<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direktori Tim — SRSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5F9;
    --surface:#FFFFFF;
    --surface-soft:#E7F5FC;
    --ink:#0B2A4A;
    --ink-soft:#526279;
    --ink-faint:#93A1B5;
    --primary:#0A3D62;
    --primary-dark:#062A45;
    --primary-soft:#DCEEFB;
    --accent:#0EA8E0;
    --accent-warm:#F7941D;
    --accent-warm-dark:#D97A0A;
    --line:#DCE6F0;
    --gradient-brand: linear-gradient(135deg,#1CA7E0 0%,#0F5C9E 55%,#0A3D62 100%);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(14,168,224,0.08), transparent 58%),
      radial-gradient(900px 520px at 100% 0%, rgba(10,61,98,0.10), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .top-accent{
    height:6px;width:100%;
    background: var(--gradient-brand);
  }
  .wrap{max-width:920px;margin:0 auto;padding:44px 24px 100px;}

  /* masthead */
  .masthead{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-bottom:36px;
    flex-wrap:wrap;gap:8px;
  }
  .masthead .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--primary-dark);
  }
  .masthead .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-faint);letter-spacing:.05em;
  }

  /* career tabs — sticky navigation so users don't need to scroll to find a section */
  .tabs-wrap{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
  }
  .tabs-scroll{
    display:flex; gap:8px; align-items:center;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:14px 0; margin-bottom:6px;
    border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  .tabs-scroll::-webkit-scrollbar{ height:4px; }
  .tabs-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:9px 16px; border-radius:20px;
    border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft);
    white-space:nowrap; flex:none; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .tab-btn:hover{ border-color:var(--accent); color:var(--ink); transform:translateY(-1px); }
  .tab-btn.active{
    background:var(--gradient-brand); color:#fff; border-color:transparent;
    box-shadow:0 3px 10px rgba(11,42,74,0.18);
  }

  /* status / error messages */
  .notice{
    font-family:'Work Sans',sans-serif;
    background:var(--surface);color:var(--ink);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:24px;
    font-size:14px;line-height:1.6;
    box-shadow:0 1px 3px rgba(43,47,78,0.05);
  }
  .notice.error{ border-left:4px solid #E0785A; }
  .notice.loading{ border-left:4px solid var(--primary); }
  .notice code{
    background:var(--surface-soft);padding:1px 6px;border-radius:4px;

  }
  .notice ul{margin:10px 0 0;padding-left:18px;}
  .notice li{margin-bottom:4px;}

  /* section */
  .section{
    position:relative;
    padding:28px 0 36px;
    border-bottom:1px dashed var(--line);
  }
  .section:last-of-type{border-bottom:none;}

  h2.header{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,4vw,38px);
    line-height:1.1;
    margin:0 0 8px;
    color:var(--ink);
    white-space:pre-line;
  }
  p.subheader{
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    color:var(--ink-soft);
    max-width:56ch;
    line-height:1.6;
    margin:0 0 22px;
    white-space:pre-line;
  }

  /* hero (judul utama / kolom "All"/"Master" di Sheet Master) */

    text-align:center;
    padding:0 0 22px;
    margin-bottom:20px;
    border-bottom:1px dashed var(--line);

  .hero-title{

    font-weight:600;
    font-size:clamp(20px,2.7vw,27px);

    font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;

    border:1px solid var(--accent-warm);

    cursor:pointer;

  .team-btn:hover{ background:var(--accent-warm-dark);border-color:var(--accent-warm-dark); }
  .team-btn:active{ transform:scale(.98); }

    margin-top:22px;padding-top:20px;
    border-top:1px dashed var(--line);

  .leaders-heading{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;

  .task-link .actions{
    display:flex;align-items:center;gap:8px;flex:none;
  }
  .icon-btn{
    width:32px;height:32px;border-radius:50%;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    text-decoration:none;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .icon-btn svg{width:15px;height:15px;flex:none;}
  .icon-btn:hover{ transform:translateY(-1px); }
  .icon-btn.icon-email:hover{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .icon-btn.icon-wa:hover{ background:#25D366; border-color:#25D366; color:#fff; }

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,47,78,0.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:40px 18px; overflow-y:auto; z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);color:var(--ink);
    border-radius:var(--radius);
    width:100%;max-width:900px;
    padding:30px 26px 36px;
    position:relative;
    box-shadow:0 12px 40px rgba(43,47,78,0.18);
  }
  .modal-close{
    position:absolute;top:18px;right:18px;
    background:none;border:none;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;
  }
  .modal-close:hover{ background:var(--surface-soft); }
  .modal h3{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:24px;margin:0 0 4px;padding-right:60px;
    color:var(--ink);
  }
  .modal .modal-sub{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    color:var(--accent-warm-dark);letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:26px;
  }

  /* Flexbox + justify-content:center supaya kartu menyesuaikan jumlah
     anggota tim dan selalu rata tengah (kiri-kanan seimbang), termasuk
     saat baris terakhir tidak penuh — beda dengan CSS grid yang akan
     merapatkan sisa kartu ke kiri. */

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 14px 18px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    box-shadow:0 1px 3px rgba(43,47,78,0.05);
    flex:1 1 198px;
    max-width:240px;

  .card::before,.card::after{
    content:"";position:absolute;top:10px;width:7px;height:7px;
    border-radius:50%;background:var(--surface-soft);
    border:1px solid var(--line);

  .card::before{left:10px;}
  .card::after{right:10px;}
  .card .dp{
    width:64px;height:64px;border-radius:50%;
    object-fit:cover;background:var(--surface-soft);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .card .dp.fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;
    color:var(--primary);
    background: var(--primary-soft);
  }
  .card hr{
    width:100%;border:none;border-top:1px dashed var(--line);
    margin:12px 0;
  }
  .card .pic-name{
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:14.5px;
    color:var(--ink);

  .card .task{

    line-height:1.5;
    white-space:pre-line;
  }
  .card .task-desc{
    font-family:'Work Sans',sans-serif;font-size:12.5px;color:var(--ink-soft);

    white-space:pre-line;

  /* single-member detail modal */
  .member-modal{ max-width:380px; text-align:center; }
  .member-card{ display:flex;flex-direction:column;align-items:center; }
  .member-card .dp{
    width:96px;height:96px;border-radius:50%;
    object-fit:cover;background:var(--surface-soft);
    border:1px solid var(--line);
  }
  .member-card .dp.fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:30px;font-weight:600;
    color:var(--primary);
    background:var(--primary-soft);
  }
  .member-card hr{
    width:100%;border:none;border-top:1px dashed var(--line);
    margin:16px 0;
  }
  .member-card .pic-name{
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;
    color:var(--ink);white-space:pre-line;
  }
  .member-card .task{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent-warm-dark);
    line-height:1.5;white-space:pre-line;
  }
  .member-card .task-desc{
    font-family:'Work Sans',sans-serif;font-size:13.5px;color:var(--ink-soft);
    line-height:1.6;white-space:pre-line;
  }
  .member-actions{
    display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
    margin-top:22px;width:100%;

  .member-action-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;
    text-decoration:none;color:#fff;border:1px solid transparent;
    transition:transform .15s ease, filter .15s ease;

  .member-action-btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }
  .member-action-btn svg{width:15px;height:15px;flex:none;}
  .member-action-btn.email{ background:var(--primary); }
  .member-action-btn.wa{ background:#25D366; }
  .member-actions .no-contact{
    font-family:'Work Sans',sans-serif;font-size:12.5px;color:var(--ink-faint);
    margin-top:4px;
  }

  footer.page-footer{
    margin-top:48px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--ink-faint);letter-spacing:.05em;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<div class="top-accent"></div>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Direktori Tim — SRSC</div>
    <div class="sub" id="masthead-sub">Course Registration &amp; Scheduling Center</div>

<script>
/* =========================================================================
   PENGATURAN — sesuaikan dua baris ini kalau perlu
   ========================================================================= */
const SPREADSHEET_ID = "1l6ZYSZA-lv3VrEFM8zMVWG_HPRf8uLmsAeimEf_sf9s";
const MASTER_SHEET_NAME = "Master";

/* =========================================================================
   ATURAN STRUKTUR SHEET (baca ini kalau halaman menampilkan pesan error)

   Sheet "Master" (disusun PER KOLOM, bukan per baris):
     Kolom A = label baris ("Sheet", "Judul", opsional "Sub Judul"/"Sub...").
     Kolom B, C, D, ... = satu kolom = satu bagian/section di halaman.
       - Baris berlabel "Sheet"  -> nama tab sheet data, harus SAMA PERSIS
         dengan nama tab aslinya (contoh: "S1 - Greater Jakarta & Bekasi").
       - Baris berlabel "Judul"  -> teks Header (judul besar) untuk section itu.
       - Baris berlabel mengandung "Sub" (opsional) -> teks subHeader.
     Kolom dengan nilai "Sheet" = "All" diperlakukan khusus: ditampilkan
     sebagai catatan/pengumuman di paling atas halaman (bukan section tim).

   Setiap sheet data (misal "S1 - Greater Jakarta & Bekasi"):
     Baris pertama = judul kolom, boleh urutan bebas, dikenali dari NAMA
     kolomnya (tidak harus persis, dicocokkan otomatis):
       - berisi kata "jabatan" atau "posisi"      -> Jabatan / Posisi
       - berisi kata "pic"                        -> PIC
       - berisi kata "email"                      -> Email
       - persis "task" (bukan "task description") -> Task
       - berisi "task" dan "desc"                 -> Task Description
       - berisi "display"/"picture"/"foto"/"photo"-> Display Picture (URL gambar)
   ========================================================================= */

const gvizUrl = (sheetName) =>
  `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

/* ---------- CSV parser sederhana (menangani tanda kutip, koma, baris baru) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else if (c === '\r'){ /* skip, biarkan \n berikutnya yang jadi baris baru */ }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c && c.trim() !== ""));
}

async function fetchSheet(sheetName){
  const res = await fetch(gvizUrl(sheetName));
  if (!res.ok) throw new Error(`Gagal mengambil sheet "${sheetName}" (status ${res.status})`);
  const text = await res.text();
  if (text.trim().startsWith("<")) {
    throw new Error(`Sheet "${sheetName}" tidak ditemukan atau belum bisa diakses publik.`);
  }
  return parseCSV(text);
}

function normalizeHeader(h){
  // Hilangkan spasi tak-standar (non-breaking space, dsb), rapikan spasi ganda,
  // dan buang tanda baca umum di ujung (titik dua, tanda bintang) supaya
  // variasi kecil penulisan header (mis. "Task:", "Task ", "TASK") tetap cocok.
  return (h || "")
    .replace(/\u00A0/g, " ")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[:*]+$/g, "")
    .trim();
}

function findCol(headerRow, matchers){
  const lower = headerRow.map(normalizeHeader);
  for (let i = 0; i < lower.length; i++){
    if (matchers(lower[i])) return i;
  }
  return -1;
}

// Urutan kolom baku sesuai sheet Master, dipakai sebagai cadangan kalau
// nama header di suatu tab section tidak persis sama dengan yang diharapkan.
const FALLBACK_ORDER = ["jabatan","pic","task","desc","dp","email","whatsapp"];

function detectColumns(headerRow){
  const cols = {
    jabatan: findCol(headerRow, h => h.includes("jabatan") || h.includes("posisi")),
    pic:     findCol(headerRow, h => h === "pic" || (h.includes("pic") && !h.includes("pictur"))),
    email:   findCol(headerRow, h => h.includes("email") || h.includes("e-mail")),
    whatsapp:findCol(headerRow, h => h.includes("whatsapp") || h === "wa" || h.includes("no wa") || h.includes("nomor wa") || h.includes("no. hp") || h.includes("no hp") || h.includes("telepon") || h.includes("phone")),
    task:    findCol(headerRow, h => h === "task" || h === "nama task" || h.includes("tugas") && !h.includes("desk") && !h.includes("uraian")),
    desc:    findCol(headerRow, h => (h.includes("task") || h.includes("tugas")) && (h.includes("desc") || h.includes("deskripsi") || h.includes("uraian")) || h === "deskripsi" || h === "description"),
    dp:      findCol(headerRow, h => h.includes("pictur") || h.includes("display") || h.includes("foto") || h.includes("photo") || h.includes("gambar") || h.includes("avatar")),
  };

  // Cadangan: kalau ada kolom penting yang tidak ketemu lewat nama header,
  // tapi jumlah kolom di baris ini sama seperti susunan baku Master,
  // pakai posisi kolomnya saja daripada membiarkan datanya hilang total.
  const missingKey = FALLBACK_ORDER.find(key => cols[key] === -1);
  if (missingKey && headerRow.length === FALLBACK_ORDER.length){
    FALLBACK_ORDER.forEach((key, i) => {
      if (cols[key] === -1) cols[key] = i;
    });
  }

  return cols;
}

function linkify(text){
  return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener" style="color:var(--primary)">${url}</a>`);
}

function toDirectImageUrl(url){
  if (!url) return url;
  const u = url.trim();
  // Link share SharePoint/OneDrive (guestaccess.aspx) tidak menampilkan gambar
  // langsung karena mengarah ke halaman preview, bukan file gambarnya.
  // Menambahkan &download=1 memaksa server mengirim file aslinya.
  if (/sharepoint\.com/i.test(u) && /guestaccess\.aspx/i.test(u) && !/[?&]download=1/i.test(u)){
    return u + (u.includes("?") ? "&" : "?") + "download=1";
  }
  return u;
}

function formatWaLink(raw){
  if (!raw) return "";
  const trimmed = String(raw).trim();
  if (!trimmed || trimmed === "-" || /^(-+|n\/?a|tbd|to be updated|belum ada|update)$/i.test(trimmed)) return "";
  let digits = trimmed.replace(/[^\d]/g, "");
  if (digits.length < 8) return ""; // terlalu pendek untuk nomor telepon asli
  if (digits.startsWith("0")) digits = "62" + digits.slice(1);
  else if (!digits.startsWith("62")) digits = "62" + digits;
  return digits;
}

function isValidEmail(str){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(str || "").trim());
}

const EMAIL_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`;
const WA_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;

// Jabatan/posisi yang diperlakukan sebagai "leader" (tidak peka besar-kecil
// huruf) — dikecualikan dari daftar task bernomor dan hanya ditampilkan di
// popup "Our Team" sebagai blok "Person In Charge". Urutan array menentukan
// urutan tampil: Section Head -> Manager -> Senior Manager.
const LEADER_TITLES = ["section head","manager","senior manager"];
const normJabatan = (j) => (j || "").toLowerCase().trim();

// Jabatan yang mengandung kata "Group" (mis. "Group Penjadwalan") — baris ini
// tetap tampil sebagai item bernomor di daftar task, tapi disembunyikan dari
// popup "Our Team" (grid semua anggota).
const isGroupRow = (j) => normJabatan(j).includes("group");

function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("");
}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function buildSection(idx, sheetKey, header, subheader, members, career){
  const secId = `sec-${idx}`;

  // Jabatan/posisi yang diperlakukan sebagai "leader" — tidak ikut dihitung/
  // tampil sebagai item bernomor di daftar task. Hanya muncul di popup
  // "Our Team" sebagai blok "Person In Charge" (lihat openModal / LEADER_TITLES).
  const regularIdx = [];
  members.forEach((m,i) => {
    if (!LEADER_TITLES.includes(normJabatan(m.jabatan))) regularIdx.push(i);
  });

  const taskLinks = regularIdx.map((i, displayPos) => {
    const m = members[i];
    const waDigits = formatWaLink(m.whatsapp);
    const emailBtn = isValidEmail(m.email)
      ? `<a class="icon-btn icon-email" href="mailto:${encodeURIComponent(m.email.trim())}" title="Email: ${escapeHtml(m.email)}" aria-label="Kirim email ke ${escapeHtml(m.email)}">${EMAIL_SVG}</a>`
      : "";
    const waBtn = waDigits
      ? `<a class="icon-btn icon-wa" href="https://wa.me/${waDigits}" target="_blank" rel="noopener" title="WhatsApp: ${escapeHtml(m.whatsapp)}" aria-label="Chat WhatsApp ${escapeHtml(m.whatsapp)}">${WA_SVG}</a>`
      : "";
    return `
    <li>
      <div class="task-link" data-sec="${idx}" data-member="${i}" role="button" tabindex="0" aria-haspopup="dialog">
        <span class="idx">${String(displayPos+1).padStart(2,"0")}</span>
        <span class="name">${escapeHtml(m.task || "(Tanpa nama task)")}</span>
        <span class="actions">${emailBtn}${waBtn}</span>
      </div>
    </li>`;
  }).join("");

  const empty = members.length === 0;
  return `
  <section class="section" id="${secId}" data-career="${escapeHtml(career || "")}" data-sheet="${escapeHtml(sheetKey)}">
    <h2 class="header">${escapeHtml(header)}</h2>
    ${subheader ? `<p class="subheader">${escapeHtml(subheader)}</p>` : ""}
    ${empty
      ? `<p class="subheader">Belum ada data PIC yang diisi untuk bagian ini.</p>`
      : `<button class="team-btn" data-target="${secId}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          Our Team
        </button>
        <ul class="task-list">${taskLinks}</ul>`}
  </section>`;
}

function memberCardHtml(m){
  return `
    <div class="card">
      ${m.dp
        ? `<img class="dp" src="${escapeHtml(toDirectImageUrl(m.dp))}" alt="${escapeHtml(m.pic)}" onerror="this.outerHTML='<div class=&quot;dp fallback&quot;>${initials(m.pic)}</div>'">`
        : `<div class="dp fallback">${initials(m.pic)}</div>`}
      <hr>
      <div class="pic-name">${escapeHtml(m.pic || "-")}</div>
      <hr>
      <div class="task">${escapeHtml(m.task || "-")}</div>
      <hr>
      <div class="task-desc">${escapeHtml(m.desc || "-")}</div>
    </div>`;
}

function openModal(header, sheetKey, members){
  // Baris dengan Jabatan mengandung "Group" tidak ikut ditampilkan di popup
  // "Our Team" (tapi tetap ada di daftar task pada halaman utama).
  const teamMembers = members.filter(m => !isGroupRow(m.jabatan));

  document.getElementById("modal-title").textContent = header;
  document.getElementById("modal-sub").textContent = `${sheetKey} — ${teamMembers.length} anggota tim`;

  // Pisahkan anggota biasa dari leader (Senior Manager/Manager/Section Head).
  // Leader ditampilkan terpisah, di blok "Person In Charge" paling bawah,
  // urut sesuai hierarki: Section Head -> Manager -> Senior Manager.
  const regular = teamMembers.filter(m => !LEADER_TITLES.includes(normJabatan(m.jabatan)));
  const leaders = teamMembers
    .filter(m => LEADER_TITLES.includes(normJabatan(m.jabatan)))
    .sort((a,b) => LEADER_TITLES.indexOf(normJabatan(a.jabatan)) - LEADER_TITLES.indexOf(normJabatan(b.jabatan)));

  const grid = document.getElementById("modal-grid");
  grid.innerHTML = regular.map(memberCardHtml).join("")
    + (leaders.length === 0 ? "" : `
      <div class="leaders-block">
        <div class="leaders-heading">Person In Charge</div>
        <div class="card-grid">${leaders.map(memberCardHtml).join("")}</div>
      </div>`);

  document.getElementById("modal-overlay").classList.add("open");
}

function openMemberModal(m){
  const waDigits = formatWaLink(m.whatsapp);
  const emailValid = isValidEmail(m.email);

  const dpHtml = m.dp
    ? `<img class="dp" src="${escapeHtml(toDirectImageUrl(m.dp))}" alt="${escapeHtml(m.pic)}" onerror="this.outerHTML='<div class=&quot;dp fallback&quot;>${initials(m.pic)}</div>'">`
    : `<div class="dp fallback">${initials(m.pic)}</div>`;

  const emailBtn = emailValid
    ? `<a class="member-action-btn email" href="mailto:${encodeURIComponent(m.email.trim())}" title="Email: ${escapeHtml(m.email)}">${EMAIL_SVG}<span>Email</span></a>`
    : "";
  const waBtn = waDigits
    ? `<a class="member-action-btn wa" href="https://wa.me/${waDigits}" target="_blank" rel="noopener" title="WhatsApp: ${escapeHtml(m.whatsapp)}">${WA_SVG}<span>WhatsApp</span></a>`
    : "";
  const actionsHtml = (emailBtn || waBtn)
    ? `<div class="member-actions">${emailBtn}${waBtn}</div>`
    : `<div class="member-actions"><span class="no-contact">Kontak belum tersedia.</span></div>`;

  document.getElementById("member-card-content").innerHTML = `
    ${dpHtml}
    <hr>
    <div class="pic-name">${escapeHtml(m.pic || "-")}</div>
    <hr>
    <div class="task">${escapeHtml(m.task || "-")}</div>
    <hr>
    <div class="task-desc">${escapeHtml(m.desc || "-")}</div>
    ${actionsHtml}
  `;
  document.getElementById("member-modal-overlay").classList.add("open");
}

document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").classList.remove("open");
});
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") e.target.classList.remove("open");
});

document.getElementById("member-modal-close").addEventListener("click", () => {
  document.getElementById("member-modal-overlay").classList.remove("open");
});
document.getElementById("member-modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "member-modal-overlay") e.target.classList.remove("open");
});

// Klik pada setiap item di daftar link (task-list) -> buka popup detail PIC.
// Klik pada tombol email/WA di sisi kanan tetap menjalankan aksi masing-masing
// (mailto:/wa.me) tanpa ikut membuka popup.
document.addEventListener("click", (e) => {
  if (e.target.closest(".icon-btn")) return;
  const link = e.target.closest(".task-link");
  if (!link) return;
  const sec = link.dataset.sec;
  const idx = link.dataset.member;
  if (sec === undefined || idx === undefined) return;
  const members = sectionMembers[Number(sec)];
  const member = members && members[Number(idx)];
  if (member) openMemberModal(member);
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const link = e.target.closest && e.target.closest(".task-link");
  if (!link) return;
  e.preventDefault();
  link.click();
});

function renderError(message, hints){
  document.getElementById("app").innerHTML = `
    <div class="notice error">
      <strong>Halaman belum bisa menampilkan data.</strong><br>
      ${escapeHtml(message)}
      ${hints ? `<ul>${hints.map(h=>`<li>${h}</li>`).join("")}</ul>` : ""}
      <ul>
        <li><strong>Melihat pesan "Failed to fetch"?</strong> Kemungkinan besar halaman ini sedang dibuka di dalam preview chat, yang memblokir koneksi internet keluar. Unduh file-nya lalu buka langsung di tab browser biasa (bukan di dalam preview chat).</li>
      </ul>
    </div>`;
}

// Global: menyimpan data anggota tim per section, dipakai baik oleh modal
// "Our Team" (grid semua anggota) maupun popup detail per-item saat sebuah
// baris di daftar task diklik.
let sectionMembers = [];

async function main(){
  let masterRows;
  try {
    masterRows = await fetchSheet(MASTER_SHEET_NAME);
  } catch (err){
    renderError(`Tidak bisa membaca sheet "${MASTER_SHEET_NAME}".`, [
      `Pastikan nama tab persis <code>${MASTER_SHEET_NAME}</code>.`,
      `Pastikan sharing sudah "Anyone with the link can view".`,
      `Pesan asli: ${escapeHtml(err.message)}`
    ]);
    return;
  }

  const labelOf = (r) => (r[0] || "").toLowerCase().trim();
  const sheetRow  = masterRows.find(r => labelOf(r) === "sheet");
  const judulRow  = masterRows.find(r => labelOf(r).includes("judul") && !labelOf(r).includes("sub"));
  const subRow    = masterRows.find(r => labelOf(r).includes("sub"));
  const careerRow = masterRows.find(r => labelOf(r).includes("career") || labelOf(r).includes("kategori"));

  if (!sheetRow || !judulRow){
    renderError(`Sheet "${MASTER_SHEET_NAME}" ditemukan, tapi baris label "Sheet" dan/atau "Judul" di kolom A tidak ketemu.`, [
      `Baris pertama di kolom A harus berisi teks <code>Sheet</code>, baris berikutnya <code>Judul</code>.`
    ]);
    return;
  }

  const numCols = Math.max(sheetRow.length, judulRow.length, subRow ? subRow.length : 0);
  const sectionsHtml = [];
  sectionMembers = [];
  const careerTabs = []; // daftar kategori unik (Career), urut sesuai kemunculan pertama di sheet Master
  let introHtml = "";

  for (let c = 1; c < numCols; c++){
    const sectionKey = (sheetRow[c] || "").trim();
    if (!sectionKey) continue;

    const header = (judulRow[c] || "").trim() || sectionKey;
    const subheader = subRow ? (subRow[c] || "").trim() : "";

    if (sectionKey.toLowerCase() === "all" || sectionKey.toLowerCase() === MASTER_SHEET_NAME.toLowerCase()){
      introHtml = `<div class="hero"><h1 class="hero-title">${linkify(header)}</h1></div>`;
      continue;
    }

    const rawCareer = careerRow ? (careerRow[c] || "").trim() : "";
    const career = (rawCareer && rawCareer !== "-") ? rawCareer : "";
    if (career && !careerTabs.includes(career)) careerTabs.push(career);

    let rows;
    try {
      rows = await fetchSheet(sectionKey);
    } catch (err){
      sectionsHtml.push(`
        <div class="notice error">
          <strong>Gagal memuat sheet "${escapeHtml(sectionKey)}".</strong><br>
          Cek apakah nama tab di Google Sheet sama persis dengan <code>${escapeHtml(sectionKey)}</code>.<br>
          Pesan asli: ${escapeHtml(err.message)}
        </div>`);
      continue;
    }

    if (rows.length < 2){
      sectionsHtml.push(`<div class="notice">Sheet "${escapeHtml(sectionKey)}" belum berisi data anggota tim.</div>`);
      continue;
    }

    const cols = detectColumns(rows[0]);
    const members = rows.slice(1).map(r => ({
      jabatan: (cols.jabatan >= 0 ? r[cols.jabatan] : "") || "",
      pic:     (cols.pic >= 0 ? r[cols.pic] : "") || "",
      email:   (cols.email >= 0 ? r[cols.email] : "") || "",
      whatsapp:(cols.whatsapp >= 0 ? r[cols.whatsapp] : "") || "",
      task:    (cols.task >= 0 ? r[cols.task] : "") || "",
      desc:    (cols.desc >= 0 ? r[cols.desc] : "") || "",
      dp:      (cols.dp >= 0 ? r[cols.dp] : "") || "",
    })).filter(m => m.pic || m.task || m.email || m.whatsapp || m.dp);

    sectionMembers.push(members);
    sectionsHtml.push(buildSection(sectionMembers.length - 1, sectionKey, header, subheader, members, career));
  }

  if (sectionsHtml.length === 0 && !introHtml){
    renderError(`Sheet "${MASTER_SHEET_NAME}" tidak berisi kolom section yang valid (kolom B dst. pada baris "Sheet" harus diisi nama tab).`);
    return;
  }

  document.getElementById("app").innerHTML = introHtml + sectionsHtml.join("");

  const tabsWrap = document.getElementById("tabs-wrap");
  if (careerTabs.length > 0){
    const allBtn = `<button class="tab-btn active" data-career="__all__" type="button">Semua</button>`;
    const catBtns = careerTabs.map(k =>
      `<button class="tab-btn" data-career="${escapeHtml(k)}" type="button">${escapeHtml(k)}</button>`
    ).join("");
    tabsWrap.innerHTML = `<div class="tabs-scroll">${allBtn}${catBtns}</div>`;

    tabsWrap.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosen = btn.dataset.career;
        document.querySelectorAll(".section[data-career]").forEach(sec => {
          const secCareer = sec.dataset.career;
          const show = chosen === "__all__" || !secCareer || secCareer === chosen;
          sec.style.display = show ? "" : "none";
        });
        tabsWrap.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
      });
    });
  } else {
    tabsWrap.innerHTML = "";
  }

  document.querySelectorAll(".team-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.target.split("-")[1], 10);
      const members = sectionMembers[idx];
      const headerEl = btn.closest(".section").querySelector(".header");
      const sheetName = btn.closest(".section").dataset.sheet || "";
      openModal(headerEl.textContent, sheetName, members);
    });
  });
}

main();
</script>
</body>
</html>
