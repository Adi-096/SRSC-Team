<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Registration &amp; Scheduling Team — SRSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152238;
    --ink-soft:#3d4a63;
    --paper:#EEF1F5;
    --paper-raised:#FFFFFF;
    --line:#CBD2DC;
    --amber:#C6922B;
    --amber-soft:#F3E6C8;
    --teal:#2E6B67;
    --teal-soft:#DCE9E7;
    --clay:#AD5230;
    --clay-soft:#EFDCD2;
    --shadow: 0 1px 2px rgba(21,34,56,0.06), 0 8px 24px -12px rgba(21,34,56,0.18);
  }

  *{ box-sizing:border-box; }

  html{ -webkit-font-smoothing:antialiased; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  a{ color:inherit; text-decoration:none; }

  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Header / grid motif ---------- */
  .grid-header{
    position:relative;
    padding:56px 20px 40px;
    overflow:hidden;
    background:
      repeating-linear-gradient(90deg, rgba(21,34,56,0.055) 0, rgba(21,34,56,0.055) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(0deg, rgba(21,34,56,0.055) 0, rgba(21,34,56,0.055) 1px, transparent 1px, transparent 32px);
    border-bottom:1px solid var(--line);
  }

  .grid-header::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(238,241,245,0) 0%, var(--paper) 96%);
    pointer-events:none;
  }

  .header-inner{
    position:relative;
    max-width:640px;
    margin:0 auto;
    text-align:left;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--teal);
    background:var(--teal-soft);
    padding:6px 10px;
    border-radius:100px;
    margin-bottom:18px;
  }

  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--teal);
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(30px, 5vw, 42px);
    line-height:1.08;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }

  .lede{
    font-size:15px;
    line-height:1.55;
    color:var(--ink-soft);
    max-width:46ch;
    margin:0;
  }

  .sync-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:0.7;
    margin:14px 0 0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .sync-status.ok .dot2{ background:var(--teal); }
  .sync-status.err .dot2{ background:var(--clay); }
  .sync-status .dot2{
    width:6px; height:6px; border-radius:50%;
    background:var(--ink-soft);
    flex:0 0 auto;
  }

  /* ---------- List view ---------- */
  main{
    max-width:640px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  .section-block + .section-block{ margin-top:34px; }

  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  .section-label .swatch{
    width:9px; height:9px; border-radius:2px;
  }

  .section-label .count{
    color:var(--ink-soft);
    opacity:0.55;
  }

  .roster{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .pic-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }

  .pic-card:hover{
    transform:translateY(-1px);
    border-color:var(--ink);
  }

  .pic-card:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }

  .pic-card .tag{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:6px;
    white-space:nowrap;
  }

  .tag.jenis-section-head{ background:var(--amber-soft); color:#8C6A17; }
  .tag.jenis-allocation{ background:var(--amber-soft); color:#8C6A17; }
  .tag.jenis-scheduling{ background:var(--teal-soft); color:var(--teal); }
  .tag.jenis-registration{ background:var(--clay-soft); color:var(--clay); }

  .swatch-color-section-head{ background:#C6922B; }
  .swatch-color-allocation{ background:#C6922B; }
  .swatch-color-scheduling{ background:var(--teal); }
  .swatch-color-registration{ background:var(--clay); }

  .pic-card .name{
    flex:1 1 auto;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:18px;
    letter-spacing:-0.01em;
  }

  .pic-card .chev{
    flex:0 0 auto;
    color:var(--ink-soft);
    opacity:0.5;
    font-size:18px;
    transition:transform .15s ease;
  }

  .pic-card:hover .chev{ transform:translateX(3px); opacity:0.9; }

  /* ---------- Detail view ---------- */
  .detail-view{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    background:none;
    border:none;
    padding:8px 0;
    margin-bottom:22px;
  }
  .back-btn:hover{ color:var(--ink); }

  .detail-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:20px;
    padding:32px 28px;
    box-shadow:var(--shadow);
  }

  .detail-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:6px;
    margin-bottom:16px;
  }

  .detail-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 6vw, 36px);
    line-height:1.06;
    letter-spacing:-0.01em;
    margin:0 0 22px;
  }

  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.65;
    margin-bottom:8px;
  }

  .pic-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }

  .jobdesk{
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink);
    padding-bottom:26px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }

  .jobdesk.empty{
    color:var(--ink-soft);
    font-style:italic;
  }

  .send-email{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    padding:14px 18px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:12px;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:background .15s ease, transform .1s ease;
  }

  .send-email:hover{ background:#243450; }
  .send-email:active{ transform:scale(0.99); }

  .send-email:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }

  .email-note{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  footer{
    max-width:640px;
    margin:0 auto;
    padding:0 20px 40px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.6;
    text-align:center;
  }

  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .pic-card, .chev, .send-email{ transition:none; }
  }
</style>
</head>
<body>

  <div id="list-screen">
    <header class="grid-header">
      <div class="header-inner">
        <span class="eyebrow"><span class="dot"></span>SRSC — Student Registration &amp; Scheduling Center</span>
        <h1>Course Registration &amp; Scheduling Team</h1>
        <p class="lede">Pilih nama untuk melihat jobdesk dan kontak masing‑masing PIC.</p>
        <p class="sync-status" id="sync-status">Memuat data terbaru dari Google Sheets…</p>
      </div>
    </header>
    <main id="roster-root"></main>
    <footer>Data Informasi Course Registration and Scheduling Team</footer>
  </div>

  <div id="detail-screen" hidden>
    <div class="detail-view">
      <button class="back-btn" id="back-btn">← Kembali ke daftar</button>
      <div class="detail-card">
        <span class="detail-tag" id="detail-tag"></span>
        <h2 class="detail-name" id="detail-name"></h2>
        <div class="field-label">Nama PIC</div>
        <div class="pic-name" id="detail-pic-name"></div>
        <div class="field-label">Description</div>
        <div class="jobdesk" id="detail-jobdesk"></div>
        <button class="send-email" id="send-email-btn">✉ &nbsp;Send Email</button>
        <div class="email-note" id="email-note"></div>
      </div>
    </div>
  </div>

<script>
  // ---- Konfigurasi sumber data ----
  // ID diambil dari URL Google Sheets: .../d/[ID_INI]/edit
  const SHEET_ID = "1l6ZYSZA-lv3VrEFM8zMVWG_HPRf8uLmsAeimEf_sf9s";
  // Ganti GID ini kalau data ada di tab/sheet lain (lihat angka setelah #gid= di URL saat tab itu dibuka)
  const SHEET_GID = "0";
  const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;

  // Data cadangan (dipakai HANYA kalau gagal mengambil data terbaru dari Sheets,
  // misalnya sedang offline atau sheet tidak bisa diakses)
  const FALLBACK_DATA = [
    { jenis:"Section Head", title:"",                                                                     email:"",                                 picName:"Thika",   description:"" },
    { jenis:"Allocation",   title:"",                                                                     email:"meydina.rizqi@binus.edu",           picName:"Meydina", description:"Validasi penjadwalan, Inbound Student, settingan BCS (KRSS, KRS, streaming, minor, elective), Penjadwalan FYP" },
    { jenis:"Scheduling",   title:"",                                                                     email:"kkomalasari@binus.edu",             picName:"Kokom",   description:"BBSUP2 (IBM, IBM GC, BC, Business Management)" },
    { jenis:"Scheduling",   title:"",                                                                     email:"mardiana.srsc@binus.edu",           picName:"Dian",    description:"All F.ENG (BioTech, FoodTech, Architecture, T.Sipil, T.Industri, Sistem Komputer) + CB + Indonesia" },
    { jenis:"Scheduling",   title:"",                                                                     email:"penjadwalansidanka@binus.edu",      picName:"Flo",     description:"All SIS (Information System, ISA, AIS, BIT, Business Analytics, dan SIMN, SIAK, SI RPL KEMENKEU) + DD" },
    { jenis:"Scheduling",   title:"Faculty of Digital Communication and Hotel & Tourism @Greater Jakarta + School of Accounting", email:"penjadwalanmc@binus.edu",           picName:"Ganesha", description:"All FDCHT (Marcomm, Masscomm, Creative Communication, HM, BHM, Tourism) dan All SOA (Accounting, Taxation, Finance)" },
    { jenis:"Scheduling",   title:"BBS Undergraduate 1 + Binus Entrepreneurship Center + Enrichment Program", email:"penjadwalanekonomi@binus.edu",      picName:"Gerry",   description:"BBSUP1 (Management, Management MT, GBM) + BEC + Enrichment" },
    { jenis:"Scheduling",   title:"",                                                                     email:"penjadwalantidansk@binus.edu",      picName:"Kevin",   description:"SOCS (CSP, Master Track CS, CS Global)" },
    { jenis:"Scheduling",   title:"",                                                                     email:"penjadwalansastra@binus.edu",       picName:"Mega",    description:"All FHUM (Chinese, Japanese, English, PGSD, Business Law, Psychology) + DLLC" },
    { jenis:"Scheduling",   title:"",                                                                     email:"muhammad.ibrahim@binus.edu",        picName:"Rafli",   description:"All SOD (New Media, Animation, Creative Advertising, Interior Design, Film + Fashion) + Binus Festival" },
    { jenis:"Scheduling",   title:"",                                                                     email:"penjadwalanmathstat@binus.edu",     picName:"Adi",     description:"SOCS Non CSP (Mathematics dan Statistics, Data Science, GAT, MAT, AI, Cyber, SE) + Koordinasi tim permohonan" },
    { jenis:"Registration", title:"",                                                                     email:"yola.kristi@binus.edu",             picName:"Yola",    description:"Registrasi Enrichment" },
    { jenis:"Registration", title:"",                                                                     email:"lyn_mhs04@binus.edu",               picName:"Wulan",   description:"Permohonan BBS, FET dan SOD" },
    { jenis:"Registration", title:"",                                                                     email:"lyn_mhs09@binus.edu",               picName:"Alief",   description:"Permohonan FHUM dan SIS" },
    { jenis:"Registration", title:"",                                                                     email:"lyn_mhs08@binus.edu",               picName:"Virna",   description:"Permohonan SOCS, SOA dan FDCHT" },
  ];

  let DATA = FALLBACK_DATA;
  const CATEGORY_ORDER = ["Section Head", "Allocation", "Scheduling", "Registration"];

  // ---- Parser CSV sederhana (menangani koma di dalam tanda kutip) ----
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\n' || c === '\r'){
          if(c === '\r' && next === '\n') i++;
          row.push(field); rows.push(row);
          row = []; field = '';
        } else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  // Kolom di sheet (nama header dicocokkan otomatis, urutan kolom boleh berubah):
  // Jenis | PIC Task | Email | PIC | Task Description
  const COLUMN_ALIASES = {
    jenis:       ['jenis'],
    title:       ['pic task', 'task', 'faculty'],
    email:       ['email'],
    picName:     ['pic', 'pic name', 'nama pic'],
    description: ['task description', 'description', 'tugas pekerjaan', 'jobdesk'],
  };

  function findColumnIndex(headerRow, aliases){
    const normalized = headerRow.map(h => (h || '').trim().toLowerCase());
    for(const alias of aliases){
      const idx = normalized.indexOf(alias);
      if(idx !== -1) return idx;
    }
    return -1;
  }

  function rowsToData(rows){
    const headerRow = rows[0] || [];
    const body = rows.slice(1);

    const colIdx = {};
    for(const key in COLUMN_ALIASES){
      colIdx[key] = findColumnIndex(headerRow, COLUMN_ALIASES[key]);
    }

    const get = (r, key) => colIdx[key] === -1 ? '' : (r[colIdx[key]] || '').trim();

    return body
      .map(r => ({
        jenis:       get(r, 'jenis'),
        title:       get(r, 'title'),
        email:       get(r, 'email'),
        picName:     get(r, 'picName'),
        description: get(r, 'description'),
      }))
      .filter(p => p.picName !== '');
  }

  function setSyncStatus(state, text){
    const el = document.getElementById('sync-status');
    el.className = 'sync-status ' + state;
    el.innerHTML = `<span class="dot2"></span>${text}`;
  }

  async function loadFromSheet(){
    try{
      const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      const parsed = rowsToData(rows);
      if(parsed.length === 0) throw new Error('Data kosong');

      DATA = parsed;
      renderRoster();
      const now = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
      setSyncStatus('ok', `Tersinkron dari Google Sheets · ${now}`);
    } catch(err){
      console.warn('Gagal memuat dari Google Sheets, memakai data cadangan.', err);
      DATA = FALLBACK_DATA;
      renderRoster();
      setSyncStatus('err', 'Gagal memuat data terbaru — menampilkan data cadangan');
    }
  }

  function slugify(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }

  function tagClass(jenis){
    return 'jenis-' + slugify(jenis);
  }

  function renderRoster(){
    const root = document.getElementById('roster-root');
    root.innerHTML = '';

    CATEGORY_ORDER.forEach(cat => {
      const people = DATA.filter(p => p.jenis === cat);
      if(people.length === 0) return;

      const block = document.createElement('section');
      block.className = 'section-block';

      const label = document.createElement('div');
      label.className = 'section-label';
      label.innerHTML = `<span class="swatch swatch-color-${slugify(cat)}"></span>
        <span>${cat}</span>
        <span class="count">· ${people.length}</span>`;

      block.appendChild(label);

      const roster = document.createElement('div');
      roster.className = 'roster';

      people.forEach(p => {
        const card = document.createElement('button');
        card.className = 'pic-card';
        card.setAttribute('aria-label', `Lihat detail ${p.picName}`);
        card.innerHTML = `
          <span class="tag ${tagClass(p.jenis)}">${p.jenis}</span>
          <span class="name">${p.picName}</span>
          <span class="chev">→</span>
        `;
        card.addEventListener('click', () => showDetail(p));
        roster.appendChild(card);
      });

      block.appendChild(roster);
      root.appendChild(block);
    });
  }

  function showDetail(person){
    document.getElementById('detail-tag').textContent = person.jenis;
    document.getElementById('detail-tag').className = 'detail-tag ' + tagClass(person.jenis);

    // Judul besar: pakai PIC Task kalau ada, kalau kosong jatuhkan ke Nama PIC
    document.getElementById('detail-name').textContent =
      (person.title && person.title.trim() !== '') ? person.title : person.picName;

    document.getElementById('detail-pic-name').textContent = person.picName;

    const jobdeskEl = document.getElementById('detail-jobdesk');
    if(person.description && person.description.trim() !== ''){
      jobdeskEl.textContent = person.description;
      jobdeskEl.classList.remove('empty');
    } else {
      jobdeskEl.textContent = 'Belum ada description tercantum untuk PIC ini.';
      jobdeskEl.classList.add('empty');
    }

    const btn = document.getElementById('send-email-btn');
    const note = document.getElementById('email-note');
    if(person.email && person.email.trim() !== ''){
      btn.disabled = false;
      btn.onclick = () => {
        window.location.href = `mailto:${person.email}`;
      };
      note.textContent = person.email;
    } else {
      btn.disabled = true;
      btn.onclick = null;
      note.textContent = 'Email tidak tersedia';
    }

    document.getElementById('list-screen').hidden = true;
    document.getElementById('detail-screen').hidden = false;
    window.scrollTo(0,0);
    history.pushState({view:'detail', name:person.picName}, '', '#' + slugify(person.picName));
  }

  function showList(){
    document.getElementById('detail-screen').hidden = true;
    document.getElementById('list-screen').hidden = false;
    window.scrollTo(0,0);
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    history.pushState({view:'list'}, '', window.location.pathname);
    showList();
  });

  window.addEventListener('popstate', (e) => {
    if(e.state && e.state.view === 'detail'){
      const person = DATA.find(p => slugify(p.picName) === slugify(e.state.name));
      if(person) showDetail(person); else showList();
    } else {
      showList();
    }
  });

  // Render dulu pakai data cadangan supaya halaman tidak kosong saat memuat,
  // lalu segera ganti dengan data terbaru dari Google Sheets.
  renderRoster();
  loadFromSheet().then(() => {
    // Deep-link support: buka langsung ke detail seseorang lewat #slug-nama
    const initialHash = window.location.hash.replace('#','');
    if(initialHash){
      const person = DATA.find(p => slugify(p.picName) === initialHash);
      if(person) showDetail(person);
    }
  });
</script>

</body>
</html>
