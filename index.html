<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direktori Tim — SRSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5FC;
    --surface:#FFFFFF;
    --surface-soft:#EEF1FB;
    --ink:#2B2F4E;
    --ink-soft:#6B7094;
    --ink-faint:#9CA1C4;
    --primary:#5B6EE8;
    --primary-dark:#4655C9;
    --primary-soft:#E6E9FC;
    --accent:#8B6FE0;
    --line:#E2E5F3;
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(139,111,224,0.10), transparent 58%),
      radial-gradient(900px 520px at 100% 0%, rgba(91,110,232,0.12), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:44px 24px 100px;}

  /* masthead */
  .masthead{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-bottom:36px;
    flex-wrap:wrap;gap:8px;
  }
  .masthead .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--primary-dark);
  }
  .masthead .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-faint);letter-spacing:.05em;
  }

  /* status / error messages */
  .notice{
    font-family:'Work Sans',sans-serif;
    background:var(--surface);color:var(--ink);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:24px;
    font-size:14px;line-height:1.6;
    box-shadow:0 1px 3px rgba(43,47,78,0.05);
  }
  .notice.error{ border-left:4px solid #E0785A; }
  .notice.loading{ border-left:4px solid var(--primary); }
  .notice code{
    background:var(--surface-soft);padding:1px 6px;border-radius:4px;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  }
  .notice ul{margin:10px 0 0;padding-left:18px;}
  .notice li{margin-bottom:4px;}

  /* section */
  .section{
    position:relative;
    padding:28px 0 36px;
    border-bottom:1px dashed var(--line);
  }
  .section:last-of-type{border-bottom:none;}

  .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;
    color:var(--primary-dark);
    background:var(--primary-soft);
    border:1px dashed var(--primary);
    border-radius:50%;
    width:54px;height:54px;
    margin-bottom:16px;
    text-align:center;
    padding:4px;
  }

  h2.header{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,4vw,38px);
    line-height:1.1;
    margin:0 0 8px;
    color:var(--ink);
  }
  p.subheader{
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    color:var(--ink-soft);
    max-width:56ch;
    line-height:1.6;
    margin:0 0 22px;
  }

  /* hero (judul utama / kolom "All"/"Master" di Sheet Master) */
  .hero{
    text-align:center;
    padding:0 0 22px;
    margin-bottom:20px;
    border-bottom:1px dashed var(--line);
  }
  .hero-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(20px,2.7vw,27px);
    line-height:1.45;
    color:var(--ink);
    max-width:64ch;
    margin:0 auto;
  }
  .hero-title a{ color:var(--primary); }

  .team-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--primary);
    border:1px solid var(--primary);
    padding:11px 20px;border-radius:8px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s ease, color .15s ease, transform .15s ease;
    margin-bottom:28px;
  }
  .team-btn:hover{ background:var(--primary-dark);border-color:var(--primary-dark); }
  .team-btn:active{ transform:scale(.98); }
  .team-btn svg{width:14px;height:14px;flex:none;}

  /* task link list */
  .task-list{list-style:none;margin:0;padding:0;}
  .task-list li{
    border-top:1px solid var(--line);
  }
  .task-list li:last-child{border-bottom:1px solid var(--line);}
  .task-link{
    display:flex;align-items:flex-start;gap:16px;
    padding:15px 4px;
    text-decoration:none;color:var(--ink);
    font-family:'Work Sans',sans-serif;font-weight:500;font-size:15px;
    transition:padding-left .15s ease, color .15s ease;
  }
  .task-link:hover{ padding-left:10px; color:var(--primary); }
  .task-link .idx{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
    flex:none;width:20px;padding-top:2px;
  }
  .task-link .name{ flex:1 1 auto;min-width:0; }
  .task-link .arrow{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);
    white-space:nowrap;flex:none;padding-top:2px;
  }

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,47,78,0.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:40px 18px; overflow-y:auto; z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);color:var(--ink);
    border-radius:var(--radius);
    width:100%;max-width:900px;
    padding:30px 26px 36px;
    position:relative;
    box-shadow:0 12px 40px rgba(43,47,78,0.18);
  }
  .modal-close{
    position:absolute;top:18px;right:18px;
    background:none;border:none;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;
  }
  .modal-close:hover{ background:var(--surface-soft); }
  .modal h3{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:24px;margin:0 0 4px;padding-right:60px;
    color:var(--ink);
  }
  .modal .modal-sub{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    color:var(--primary);letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:26px;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(198px,1fr));
    gap:18px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 14px 18px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    box-shadow:0 1px 3px rgba(43,47,78,0.05);
  }
  .card::before,.card::after{
    content:"";position:absolute;top:10px;width:7px;height:7px;
    border-radius:50%;background:var(--surface-soft);
    border:1px solid var(--line);
  }
  .card::before{left:10px;}
  .card::after{right:10px;}
  .card .dp{
    width:64px;height:64px;border-radius:50%;
    object-fit:cover;background:var(--surface-soft);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .card .dp.fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;
    color:var(--primary);
  }
  .card hr{
    width:100%;border:none;border-top:1px dashed var(--line);
    margin:12px 0;
  }
  .card .pic-name{
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:14.5px;
    color:var(--ink);
  }
  .card .task{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
    line-height:1.5;
  }
  .card .task-desc{
    font-family:'Work Sans',sans-serif;font-size:12.5px;color:var(--ink-soft);
    line-height:1.55;
  }

  footer.page-footer{
    margin-top:48px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--ink-faint);letter-spacing:.05em;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="brand">Direktori Tim — SRSC</div>
    <div class="sub" id="masthead-sub">Course Registration &amp; Scheduling Center</div>
  </div>

  <div id="app">
    <div class="notice loading">Memuat data dari Google Sheet…</div>
  </div>

  <footer class="page-footer">Data diambil langsung dan otomatis dari Google Sheet terkait.</footer>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">Tutup ✕</button>
    <h3 id="modal-title"></h3>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="card-grid" id="modal-grid"></div>
  </div>
</div>

<script>
/* =========================================================================
   PENGATURAN — sesuaikan dua baris ini kalau perlu
   ========================================================================= */
const SPREADSHEET_ID = "1l6ZYSZA-lv3VrEFM8zMVWG_HPRf8uLmsAeimEf_sf9s";
const MASTER_SHEET_NAME = "Master";

/* =========================================================================
   ATURAN STRUKTUR SHEET (baca ini kalau halaman menampilkan pesan error)

   Sheet "Master" (disusun PER KOLOM, bukan per baris):
     Kolom A = label baris ("Sheet", "Judul", opsional "Sub Judul"/"Sub...").
     Kolom B, C, D, ... = satu kolom = satu bagian/section di halaman.
       - Baris berlabel "Sheet"  -> nama tab sheet data, harus SAMA PERSIS
         dengan nama tab aslinya (contoh: "S1 - Greater Jakarta & Bekasi").
       - Baris berlabel "Judul"  -> teks Header (judul besar) untuk section itu.
       - Baris berlabel mengandung "Sub" (opsional) -> teks subHeader.
     Kolom dengan nilai "Sheet" = "All" diperlakukan khusus: ditampilkan
     sebagai catatan/pengumuman di paling atas halaman (bukan section tim).

   Setiap sheet data (misal "S1 - Greater Jakarta & Bekasi"):
     Baris pertama = judul kolom, boleh urutan bebas, dikenali dari NAMA
     kolomnya (tidak harus persis, dicocokkan otomatis):
       - berisi kata "jabatan" atau "posisi"      -> Jabatan / Posisi
       - berisi kata "pic"                        -> PIC
       - berisi kata "email"                      -> Email
       - persis "task" (bukan "task description") -> Task
       - berisi "task" dan "desc"                 -> Task Description
       - berisi "display"/"picture"/"foto"/"photo"-> Display Picture (URL gambar)
   ========================================================================= */

const gvizUrl = (sheetName) =>
  `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

/* ---------- CSV parser sederhana (menangani tanda kutip, koma, baris baru) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c && c.trim() !== ""));
}

async function fetchSheet(sheetName){
  const res = await fetch(gvizUrl(sheetName));
  if (!res.ok) throw new Error(`Gagal mengambil sheet "${sheetName}" (status ${res.status})`);
  const text = await res.text();
  if (text.trim().startsWith("<")) {
    throw new Error(`Sheet "${sheetName}" tidak ditemukan atau belum bisa diakses publik.`);
  }
  return parseCSV(text);
}

function findCol(headerRow, matchers){
  const lower = headerRow.map(h => (h||"").toLowerCase().trim());
  for (let i = 0; i < lower.length; i++){
    if (matchers(lower[i])) return i;
  }
  return -1;
}

function detectColumns(headerRow){
  return {
    jabatan: findCol(headerRow, h => h.includes("jabatan") || h.includes("posisi")),
    pic:     findCol(headerRow, h => h.trim() === "pic" || (h.includes("pic") && !h.includes("pictur"))),
    email:   findCol(headerRow, h => h.includes("email")),
    task:    findCol(headerRow, h => h.trim() === "task"),
    desc:    findCol(headerRow, h => h.includes("task") && h.includes("desc")),
    dp:      findCol(headerRow, h => h.includes("pictur") || h.includes("display") || h.includes("foto") || h.includes("photo") || h.includes("gambar")),
  };
}

function linkify(text){
  return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener" style="color:var(--primary)">${url}</a>`);
}

function toDirectImageUrl(url){
  if (!url) return url;
  const u = url.trim();
  // Link share SharePoint/OneDrive (guestaccess.aspx) tidak menampilkan gambar
  // langsung karena mengarah ke halaman preview, bukan file gambarnya.
  // Menambahkan &download=1 memaksa server mengirim file aslinya.
  if (/sharepoint\.com/i.test(u) && /guestaccess\.aspx/i.test(u) && !/[?&]download=1/i.test(u)){
    return u + (u.includes("?") ? "&" : "?") + "download=1";
  }
  return u;
}

function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("");
}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function buildSection(idx, sheetKey, header, subheader, members){
  const secId = `sec-${idx}`;
  const taskLinks = members.map((m,i) => `
    <li>
      <a class="task-link" href="mailto:${encodeURIComponent(m.email)}">
        <span class="idx">${String(i+1).padStart(2,"0")}</span>
        <span class="name">${escapeHtml(m.task || "(Tanpa nama task)")}</span>
        <span class="arrow">${escapeHtml(m.email || "")} →</span>
      </a>
    </li>`).join("");

  const empty = members.length === 0;
  return `
  <section class="section">
    <div class="stamp">${escapeHtml(sheetKey.split(" ")[0] || sheetKey).slice(0,6)}</div>
    <h2 class="header">${escapeHtml(header)}</h2>
    ${subheader ? `<p class="subheader">${escapeHtml(subheader)}</p>` : ""}
    ${empty
      ? `<p class="subheader">Belum ada data PIC yang diisi untuk bagian ini.</p>`
      : `<button class="team-btn" data-target="${secId}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          Our Team
        </button>
        <ul class="task-list">${taskLinks}</ul>`}
  </section>`;
}

function openModal(header, sheetKey, members){
  document.getElementById("modal-title").textContent = header;
  document.getElementById("modal-sub").textContent = `${sheetKey} — ${members.length} anggota tim`;
  const grid = document.getElementById("modal-grid");
  grid.innerHTML = members.map(m => `
    <div class="card">
      ${m.dp
        ? `<img class="dp" src="${escapeHtml(toDirectImageUrl(m.dp))}" alt="${escapeHtml(m.pic)}" onerror="this.outerHTML='<div class=&quot;dp fallback&quot;>${initials(m.pic)}</div>'">`
        : `<div class="dp fallback">${initials(m.pic)}</div>`}
      <hr>
      <div class="pic-name">${escapeHtml(m.pic || "-")}</div>
      <hr>
      <div class="task">${escapeHtml(m.task || "-")}</div>
      <hr>
      <div class="task-desc">${escapeHtml(m.desc || "-")}</div>
    </div>
  `).join("");
  document.getElementById("modal-overlay").classList.add("open");
}

document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").classList.remove("open");
});
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") e.target.classList.remove("open");
});

function renderError(message, hints){
  document.getElementById("app").innerHTML = `
    <div class="notice error">
      <strong>Halaman belum bisa menampilkan data.</strong><br>
      ${escapeHtml(message)}
      ${hints ? `<ul>${hints.map(h=>`<li>${h}</li>`).join("")}</ul>` : ""}
      <ul>
        <li><strong>Melihat pesan "Failed to fetch"?</strong> Kemungkinan besar halaman ini sedang dibuka di dalam preview chat, yang memblokir koneksi internet keluar. Unduh file-nya lalu buka langsung di tab browser biasa (bukan di dalam preview chat).</li>
      </ul>
    </div>`;
}

async function main(){
  let masterRows;
  try {
    masterRows = await fetchSheet(MASTER_SHEET_NAME);
  } catch (err){
    renderError(`Tidak bisa membaca sheet "${MASTER_SHEET_NAME}".`, [
      `Pastikan nama tab persis <code>${MASTER_SHEET_NAME}</code>.`,
      `Pastikan sharing sudah "Anyone with the link can view".`,
      `Pesan asli: ${escapeHtml(err.message)}`
    ]);
    return;
  }

  const labelOf = (r) => (r[0] || "").toLowerCase().trim();
  const sheetRow  = masterRows.find(r => labelOf(r) === "sheet");
  const judulRow  = masterRows.find(r => labelOf(r).includes("judul") && !labelOf(r).includes("sub"));
  const subRow    = masterRows.find(r => labelOf(r).includes("sub"));

  if (!sheetRow || !judulRow){
    renderError(`Sheet "${MASTER_SHEET_NAME}" ditemukan, tapi baris label "Sheet" dan/atau "Judul" di kolom A tidak ketemu.`, [
      `Baris pertama di kolom A harus berisi teks <code>Sheet</code>, baris berikutnya <code>Judul</code>.`
    ]);
    return;
  }

  const numCols = Math.max(sheetRow.length, judulRow.length, subRow ? subRow.length : 0);
  const sectionsHtml = [];
  const sectionMembers = [];
  let introHtml = "";

  for (let c = 1; c < numCols; c++){
    const sectionKey = (sheetRow[c] || "").trim();
    if (!sectionKey) continue;

    const header = (judulRow[c] || "").trim() || sectionKey;
    const subheader = subRow ? (subRow[c] || "").trim() : "";

    if (sectionKey.toLowerCase() === "all" || sectionKey.toLowerCase() === MASTER_SHEET_NAME.toLowerCase()){
      introHtml = `<div class="hero"><h1 class="hero-title">${linkify(header)}</h1></div>`;
      continue;
    }

    let rows;
    try {
      rows = await fetchSheet(sectionKey);
    } catch (err){
      sectionsHtml.push(`
        <div class="notice error">
          <strong>Gagal memuat sheet "${escapeHtml(sectionKey)}".</strong><br>
          Cek apakah nama tab di Google Sheet sama persis dengan <code>${escapeHtml(sectionKey)}</code>.<br>
          Pesan asli: ${escapeHtml(err.message)}
        </div>`);
      continue;
    }

    if (rows.length < 2){
      sectionsHtml.push(`<div class="notice">Sheet "${escapeHtml(sectionKey)}" belum berisi data anggota tim.</div>`);
      continue;
    }

    const cols = detectColumns(rows[0]);
    const members = rows.slice(1).map(r => ({
      jabatan: cols.jabatan >= 0 ? r[cols.jabatan] : "",
      pic:     cols.pic >= 0 ? r[cols.pic] : "",
      email:   cols.email >= 0 ? r[cols.email] : "",
      task:    cols.task >= 0 ? r[cols.task] : "",
      desc:    cols.desc >= 0 ? r[cols.desc] : "",
      dp:      cols.dp >= 0 ? r[cols.dp] : "",
    })).filter(m => m.pic || m.task);

    sectionMembers.push(members);
    sectionsHtml.push(buildSection(sectionMembers.length - 1, sectionKey, header, subheader, members));
  }

  if (sectionsHtml.length === 0 && !introHtml){
    renderError(`Sheet "${MASTER_SHEET_NAME}" tidak berisi kolom section yang valid (kolom B dst. pada baris "Sheet" harus diisi nama tab).`);
    return;
  }

  document.getElementById("app").innerHTML = introHtml + sectionsHtml.join("");

  document.querySelectorAll(".team-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.target.split("-")[1], 10);
      const members = sectionMembers[idx];
      const headerEl = btn.closest(".section").querySelector(".header");
      const stampEl = btn.closest(".section").querySelector(".stamp");
      openModal(headerEl.textContent, stampEl.textContent, members);
    });
  });
}

main();
</script>
</body>
</html>
